[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabm-bridge"
version = "0.1.0"
description = "G0 Baseline Parity + TabM-Bridge & Orthogonal Procrustes Alignment"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "rtdl-num-embeddings>=0.0.12,<0.1",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "catboost>=1.2.5",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]